name: 🏥 حجز مستشفى إيليت

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      booking_url:
        description: 'رابط الحجز'
        required: true
        default: 'https://www.elitehospital.org/Booking/Find?culture=ar'
        type: string

jobs:
  book:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: تجهيز بايثون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: تثبيت المتطلبات
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps
      
      - name: تشغيل الحجز
        run: python booking.py
        env:
          BOOKING_URL: ${{ github.event.inputs.booking_url || secrets.BOOKING_URL || 'https://www.elitehospital.org/Booking/Find?culture=ar' }}
      
      - name: رفع النتيجة
        uses: actions/upload-artifact@v3
        with:
          name: booking-result
          path: booking_result.json
      
      - name: تجهيز الملفات
        run: |
          mkdir -p docs/api
          if [ -f booking_result.json ]; then
            cp booking_result.json docs/api/status.json
          else
            echo '{"status":"⏳ لا توجد نتيجة بعد"}' > docs/api/status.json
          fi
      
      - name: رفع الصفحة
        uses: actions/upload-pages-artifact@v2
        with:
          path: docs/
      
      - name: نشر الصفحة
        uses: actions/deploy-pages@v2
