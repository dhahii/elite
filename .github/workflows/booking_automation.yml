name: Elite Hospital Booking Automation

on:
  repository_dispatch:
    types: [new_booking]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      booking_url:
        description: 'رابط الموعد (للتجربة)'
        required: false
        type: string

jobs:
  process_booking:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ⭐️ الخطوة 1: استقبال الرابط من التطبيق
    - name: Save booking URL from app
      if: github.event_name == 'repository_dispatch'
      run: |
        echo "📥 استقبال رابط من التطبيق"
        echo '${{ toJSON(github.event.client_payload) }}' > booking-url.json
        echo "✅ تم حفظ رابط الموعد"
        cat booking-url.json
    
    # ⭐️ الخطوة 2: قراءة الرابط من JSON
    - name: Read booking URL
      id: read_url
      run: |
        if [ -f "booking-url.json" ]; then
          URL=$(cat booking-url.json | jq -r '.url')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ الرابط من JSON: $URL"
        else
          echo "url=" >> $GITHUB_OUTPUT
        fi
    
    # ⭐️ الخطوة 3: تحميل صفحة الموعد (فوراً)
    - name: Load booking page
      run: |
        URL="${{ github.event.inputs.booking_url || steps.read_url.outputs.url }}"
        
        if [ -z "$URL" ]; then
          echo "❌ لا يوجد رابط"
          echo '{"success":false,"message":"لا يوجد رابط","timestamp":"'$(date -Iseconds)'","bookingDetails":null}' > booking-result.json
          exit 1
        fi
        
        echo "🌐 تحميل صفحة الموعد: $URL"
        curl -s -L \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9" \
          -H "Accept-Language: ar-EG,ar;q=0.9,en;q=0.8" \
          "$URL" > page.html
        
        echo "📄 حجم الصفحة: $(wc -c < page.html) بايت"
    
    # ⭐️ الخطوة 4: تثبيت أدوات معالجة HTML
    - name: Install HTML tools
      run: |
        sudo apt-get update
        sudo apt-get install -y html-xml-utils
    
    # ⭐️ الخطوة 5: استخراج اسم الدكتور والعيادة (فوراً) - طريقة محسنة
    - name: Extract doctor and clinic name
      id: extract_doctor
      run: |
        echo "📋 استخراج اسم الدكتور والعيادة..."
        
        # ⭐️ تنظيف الصفحة من الترميزات
        cat page.html | sed 's/&#x[0-9a-fA-F]*;//g' | sed 's/&#[0-9]*;//g' > page-clean.html
        
        # ⭐️ استخراج اسم الدكتور - من <h5> مباشرة
        DOCTOR=$(grep -o '<h5[^>]*>[^<]*</h5>' page-clean.html | head -1 | sed 's/<[^>]*>//g' | xargs)
        
        # إذا لم يتم العثور عليه، حاول البحث عن <h4>
        if [ -z "$DOCTOR" ] || [ "$DOCTOR" = "/" ] || [ "$DOCTOR" = "" ]; then
          DOCTOR=$(grep -o '<h4[^>]*>[^<]*</h4>' page-clean.html | head -1 | sed 's/<[^>]*>//g' | xargs)
        fi
        
        # إذا لم يتم العثور عليه، حاول البحث عن "د/"
        if [ -z "$DOCTOR" ] || [ "$DOCTOR" = "/" ] || [ "$DOCTOR" = "" ]; then
          DOCTOR=$(grep -o 'د/[^<"]*' page-clean.html | head -1 | xargs)
        fi
        
        # إذا لم يتم العثور عليه، حاول البحث عن النص بين علامات h5 باستخدام hxselect
        if [ -z "$DOCTOR" ] || [ "$DOCTOR" = "/" ] || [ "$DOCTOR" = "" ]; then
          DOCTOR=$(hxselect -c 'h5' page-clean.html 2>/dev/null | head -1 | xargs)
        fi
        
        [ -z "$DOCTOR" ] && DOCTOR="غير معروف"
        
        # ⭐️ استخراج اسم العيادة - من <h6> مباشرة
        CLINIC=$(grep -o '<h6[^>]*>[^<]*</h6>' page-clean.html | head -1 | sed 's/<[^>]*>//g' | xargs)
        
        # إذا لم يتم العثور عليه، حاول البحث عن <h5> الثاني
        if [ -z "$CLINIC" ] || [ "$CLINIC" = "عيادة يوم" ] || [ "$CLINIC" = "" ]; then
          CLINIC=$(grep -o '<h5[^>]*>[^<]*</h5>' page-clean.html | head -2 | tail -1 | sed 's/<[^>]*>//g' | xargs)
        fi
        
        # إذا لم يتم العثور عليه، حاول البحث عن "عيادة"
        if [ -z "$CLINIC" ] || [ "$CLINIC" = "عيادة يوم" ] || [ "$CLINIC" = "" ]; then
          CLINIC=$(grep -o 'عيادة[^<"]*' page-clean.html | head -1 | xargs)
        fi
        
        # إذا لم يتم العثور عليه، استخدم hxselect
        if [ -z "$CLINIC" ] || [ "$CLINIC" = "عيادة يوم" ] || [ "$CLINIC" = "" ]; then
          CLINIC=$(hxselect -c 'h6' page-clean.html 2>/dev/null | head -1 | xargs)
        fi
        
        [ -z "$CLINIC" ] && CLINIC="غير معروف"
        
        # ⭐️ استخراج التاريخ والوقت من الصفحة
        # التاريخ: 09-05-2026
        BOOKING_DATE=$(grep -o '[0-9]\{2\}-[0-9]\{2\}-[0-9]\{4\}' page-clean.html | head -1)
        # الوقت: 11:00
        BOOKING_TIME=$(grep -o '[0-9]\{2\}:[0-9]\{2\}' page-clean.html | head -1)
        
        if [ -n "$BOOKING_DATE" ] && [ -n "$BOOKING_TIME" ]; then
          DATE="$BOOKING_DATE $BOOKING_TIME"
          DATE=$(echo "$DATE" | sed 's/-/\//g')
        else
          DATE=$(date '+%d/%m/%Y %H:%M:%S')
        fi
        
        # ⭐️ استخراج رقم الموعد من الرابط
        PATIENT_FROM_URL=$(echo "${{ steps.read_url.outputs.url }}" | grep -o '[0-9]\{7,8\}' | head -1)
        
        # ⭐️ رابط الحجز الأصلي
        ORIGINAL_URL=$(cat booking-url.json | jq -r '.url')
        
        # ⭐️ تحديث نفس ملف booking-result.json (المرة الأولى)
        cat > booking-result.json << EOF
        {
          "success": true,
          "message": "تم استخراج بيانات الطبيب",
          "timestamp": "$(date -Iseconds)",
          "bookingDetails": {
            "doctorName": "$DOCTOR",
            "clinicName": "$CLINIC",
            "patientNumber": "$PATIENT_FROM_URL",
            "currentNumber": "جاري الحجز...",
            "status": "⏳ في انتظار الحجز الساعة 7:00",
            "appointmentDate": "$DATE",
            "bookingURL": "$ORIGINAL_URL"
          }
        }
        EOF
        
        echo "✅ تم تحديث booking-result.json ببيانات الطبيب"
        echo "👨‍⚕️ الطبيب: $DOCTOR"
        echo "🏥 العيادة: $CLINIC"
        echo "📅 التاريخ: $DATE"
        echo "🔢 رقم الموعد: $PATIENT_FROM_URL"
        echo "⏳ الانتظار حتى الساعة 7:00 صباحاً..."
    
    # ⭐️ الخطوة 6: الانتظار حتى الساعة 7:00 صباحاً
    - name: Wait until 7:00 AM
      run: |
        echo "⏳ بدء الانتظار حتى الساعة 7:00 صباحاً..."
        
        while true; do
          CURRENT_HOUR=$(date +%H)
          CURRENT_MIN=$(date +%M)
          
          if [ "$CURRENT_HOUR" -ge 7 ] && [ "$CURRENT_MIN" -ge 0 ]; then
            echo "✅ الساعة الآن 7:00 صباحاً - بدء التنفيذ!"
            break
          fi
          
          echo "⏳ الوقت الآن: $(date +%H:%M) - الانتظار..."
          sleep 60
        done
    
    # ⭐️ الخطوة 7: البحث عن زر "قم بالحجز الأن" (بطريقة أكثر دقة)
    - name: Find booking button
      id: find_button
      run: |
        # ⭐️ البحث عن الرابط باستخدام عدة أنماط للتأكد من العثور عليه
        BOOKING_LINK=$(grep -oE 'href="([^"]*Booking/Find[^"]*)"' page.html | head -1^']* | sed 's/href="//;s/"//g')
        
        # إذا لم يتم العثور عليه بالطريقة الأولى، جرب طريقة أخرى
        if [ -z "$BOOKING_LINK" ]; then
          BOOKING_LINK=$(grep -o "href='[^']*Booking/Find['" page.html | head -1 | sed "s/href='//;s/'//g")
        fi
        
        # إذا لم يتم العثور عليه، جرب البحث عن النص العربي للزر
        if [ -z "$BOOKING_LINK" ]; then
          BOOKING_LINK=$(grep -o 'href="[^"]*"' page.html | grep "Booking/Find" | head -1 | sed 's/href="//;s/"//g')
        fi
            
        if [ -n "$BOOKING_LINK" ]; then
          echo "✅ تم العثور على زر الحجز: $BOOKING_LINK"
          echo "link=$BOOKING_LINK" >> $GITHUB_OUTPUT
          
          if [[ "$BOOKING_LINK" == https* ]]; then
            FULL_URL="$BOOKING_LINK"
          else
            FULL_URL="https://www.elitehospital.org$BOOKING_LINK"
          fi
          echo "full_url=$FULL_URL" >> $GITHUB_OUTPUT
        else
          echo "⚠️ لم يتم العثور على زر الحجز"
          echo "link=" >> $GITHUB_OUTPUT
        fi
    
    # ⭐️ الخطوة 8: الضغط على زر الحجز (الساعة 7:00)
    - name: Click booking button
      if: steps.find_button.outputs.link != ''
      run: |
        FULL_URL="${{ steps.find_button.outputs.full_url }}"
        echo "🖱️ الضغط على زر الحجز: $FULL_URL"
        echo "⏰ الوقت: $(date)"
        
        curl -s -L \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9" \
          -H "Accept-Language: ar-EG,ar;q=0.9,en;q=0.8" \
          -H "Referer: ${{ steps.read_url.outputs.url }}" \
          "$FULL_URL" > booking-page.html
        
        echo "📄 حجم صفحة الحجز: $(wc -c < booking-page.html) بايت"
    
    # ⭐️ الخطوة 9: استخراج رقم الدور وتحديث نفس الملف (المرة الثانية)
    - name: Extract queue number and update same file
      run: |
        echo "📋 استخراج رقم الدور من صفحة الحجز..."
        
        # ⭐️ تنظيف الصفحة
        cat booking-page.html | sed 's/&#x[0-9a-fA-F]*;//g' | sed 's/&#[0-9]*;//g' > booking-clean.html
        
        # ⭐️ استخراج رقم المريض - من الرابط أو من الصفحة
        PATIENT=$(echo "${{ steps.read_url.outputs.url }}" | grep -o '[0-9]\{7,8\}' | head -1)
        if [ -z "$PATIENT" ]; then
          PATIENT=$(grep -o '[0-9]\{7,8\}' booking-clean.html | head -1)
        fi
        [ -z "$PATIENT" ] && PATIENT="غير معروف"
        
        # ⭐️ استخراج الرقم الحالي (من الصفحة)
        CURRENT=$(grep -o 'الرقم الحالي[^0-9]*[0-9]\+' booking-clean.html | grep -o '[0-9]\+' | head -1)
        if [ -z "$CURRENT" ]; then
          CURRENT=$(grep -o '<h2[^>]*>[^<]*</h2>' booking-clean.html | grep -o '[0-9]\+' | head -1)
        fi
        if [ -z "$CURRENT" ]; then
          CURRENT=$(grep -o 'رقمك[^0-9]*[0-9]\+' booking-clean.html | grep -o '[0-9]\+' | head -1)
        fi
        [ -z "$CURRENT" ] && CURRENT="0"
        
        # ⭐️ استخراج التاريخ من صفحة الحجز
        BOOKING_DATE=$(grep -o '[0-9]\{2\}-[0-9]\{2\}-[0-9]\{4\}' booking-clean.html | head -1)
        BOOKING_TIME=$(grep -o '[0-9]\{2\}:[0-9]\{2\}' booking-clean.html | head -1)
        
        if [ -n "$BOOKING_DATE" ] && [ -n "$BOOKING_TIME" ]; then
          DATE="$BOOKING_DATE $BOOKING_TIME"
          DATE=$(echo "$DATE" | sed 's/-/\//g')
        else
          DATE=$(date '+%d/%m/%Y %H:%M:%S')
        fi
        
        # ⭐️ قراءة اسم الدكتور والعيادة من الملف الحالي
        DOCTOR=$(cat booking-result.json | jq -r '.bookingDetails.doctorName')
        CLINIC=$(cat booking-result.json | jq -r '.bookingDetails.clinicName')
        ORIGINAL_URL=$(cat booking-result.json | jq -r '.bookingDetails.bookingURL')
        
        # ⭐️ تحديث نفس ملف booking-result.json (المرة الثانية)
        cat > booking-result.json << EOF
        {
          "success": true,
          "message": "تم الحجز بنجاح",
          "timestamp": "$(date -Iseconds)",
          "bookingDetails": {
            "doctorName": "$DOCTOR",
            "clinicName": "$CLINIC",
            "patientNumber": "$PATIENT",
            "currentNumber": "$CURRENT",
            "status": "✅ تم الحجز بنجاح",
            "appointmentDate": "$DATE",
            "bookingURL": "$ORIGINAL_URL"
          }
        }
        EOF
        
        echo "✅ تم تحديث نفس ملف booking-result.json بالبيانات النهائية"
        echo "👨‍⚕️ الطبيب: $DOCTOR"
        echo "🏥 العيادة: $CLINIC"
        echo "🔢 رقمك: $PATIENT"
        echo "📊 الرقم الحالي: $CURRENT"
        echo "📅 التاريخ: $DATE"
    
    # ⭐️ الخطوة 10: رفع النتيجة
    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: booking-result
        path: |
          booking-result.json
          booking-url.json
          page.html
          booking-page.html
          page-clean.html
          booking-clean.html
        retention-days: 7
    
    # ⭐️ الخطوة 11: حفظ النتيجة في المستودع
    - name: Commit and push result
      if: success()
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add booking-result.json booking-url.json 2>/dev/null || true
        git commit -m "Update booking result [skip ci]" || echo "No changes to commit"
        git push