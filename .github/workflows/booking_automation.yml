name: Elite Hospital Booking Automation

on:
  workflow_dispatch:
    inputs:
      scheduled_time:
        description: 'وقت بدء التشغيل (6:59)'
        required: true
        default: '06:59'
        type: string

jobs:
  book_appointment:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        npm install playwright node-cron
        npx playwright install
    
    - name: Create booking script
      run: |
        cat > booking.js << 'EOF'
        const { chromium } = require('playwright');
        const cron = require('node-cron');
        const fs = require('fs');
        const https = require('https');
        
        // ⭐️ وقت التنفيذ المطلوب (7:00 صباحاً)
        const EXECUTION_TIME = '07:00';
        
        // ⭐️ قراءة الرابط من ملف JSON
        function getBookingURL() {
          try {
            const data = fs.readFileSync('booking-url.json', 'utf8');
            const json = JSON.parse(data);
            return json.url;
          } catch (error) {
            console.error('❌ خطأ في قراءة الرابط:', error.message);
            return null;
          }
        }
        
        // ⭐️ حفظ النتيجة في ملف JSON
        function saveResult(result) {
          fs.writeFileSync('booking-result.json', JSON.stringify(result, null, 2));
          console.log('✅ تم حفظ النتيجة');
        }
        
        // ⭐️ تحديث حالة الرابط إلى "completed"
        function updateBookingStatus() {
          try {
            const data = fs.readFileSync('booking-url.json', 'utf8');
            const json = JSON.parse(data);
            json.status = 'completed';
            json.executedAt = new Date().toISOString();
            fs.writeFileSync('booking-url.json', JSON.stringify(json, null, 2));
            console.log('✅ تم تحديث حالة الرابط');
          } catch (error) {
            console.error('❌ خطأ في تحديث الحالة:', error.message);
          }
        }
        
        // ⭐️ وظيفة الحجز الرئيسية
        async function performBooking() {
          const bookingURL = getBookingURL();
          if (!bookingURL) {
            saveResult({
              success: false,
              message: 'لا يوجد رابط للحجز',
              timestamp: new Date().toISOString(),
              bookingDetails: null
            });
            return;
          }
          
          console.log(`🔗 رابط الموعد: ${bookingURL}`);
          console.log(`⏰ بدء الحجز الساعة: ${new Date().toLocaleString('ar-EG')}`);
          
          const browser = await chromium.launch({
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });
          
          try {
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            
            // 1. فتح الرابط
            console.log('🌐 جاري فتح الرابط...');
            await page.goto(bookingURL, { waitUntil: 'networkidle2', timeout: 30000 });
            
            // 2. استخراج البيانات
            console.log('📋 جاري استخراج البيانات...');
            const bookingData = await page.evaluate(() => {
              const doctorName = document.querySelector('.jumbotron h5')?.textContent?.trim() || 'غير معروف';
              const clinicName = document.querySelector('.jumbotron h6')?.textContent?.trim() || 'غير معروف';
              const patientNumber = document.querySelector('.jumbotron h1')?.textContent?.trim() || 'غير معروف';
              const currentNumber = document.querySelector('.jumbotron h2 span')?.textContent?.trim() || '0';
              const appointmentDate = document.querySelector('.jumbotron small')?.textContent?.trim() || new Date().toLocaleString('ar-EG');
              const bookingLink = document.querySelector('a[href*="/Booking/Find"]')?.href || '';
              
              return { doctorName, clinicName, patientNumber, currentNumber, appointmentDate, bookingURL: bookingLink };
            });
            
            // 3. البحث عن زر الحجز
            console.log('🔍 جاري البحث عن زر الحجز...');
            const bookingButton = await page.$('a[href*="/Booking/Find"]');
            if (bookingButton) {
              console.log('🖱️ جاري الضغط على زر الحجز...');
              await bookingButton.click();
              await page.waitForNavigation({ waitUntil: 'networkidle2', timeout: 10000 });
              console.log('✅ تم الضغط على زر الحجز بنجاح');
            }
            
            // 4. حفظ النتيجة
            const result = {
              success: true,
              message: 'تم الحجز بنجاح',
              timestamp: new Date().toISOString(),
              bookingDetails: {
                doctorName: bookingData.doctorName,
                clinicName: bookingData.clinicName,
                patientNumber: bookingData.patientNumber,
                currentNumber: bookingData.currentNumber,
                status: '✅ تم الحجز بنجاح',
                appointmentDate: bookingData.appointmentDate,
                bookingURL: bookingData.bookingURL
              }
            };
            
            saveResult(result);
            updateBookingStatus();
            console.log('✅ اكتملت عملية الحجز بنجاح');
            
          } catch (error) {
            console.error('❌ حدث خطأ:', error.message);
            saveResult({
              success: false,
              message: error.message,
              timestamp: new Date().toISOString(),
              bookingDetails: null
            });
          } finally {
            await browser.close();
          }
        }
        
        // ⭐️ دالة الانتظار حتى وقت محدد
        function waitUntilTime(targetTime) {
          return new Promise((resolve) => {
            const now = new Date();
            const target = new Date();
            const [hours, minutes] = targetTime.split(':');
            target.setHours(parseInt(hours), parseInt(minutes), 0, 0);
            
            if (target <= now) {
              target.setDate(target.getDate() + 1);
            }
            
            const diff = target - now;
            console.log(`⏳ انتظار ${Math.floor(diff / 60000)} دقيقة حتى الساعة ${targetTime}`);
            setTimeout(resolve, diff);
          });
        }
        
        // ⭐️ التنفيذ الرئيسي
        async function main() {
          console.log('🔄 بدء تشغيل نظام الحجز الآلي...');
          console.log(`⏰ سيتم التنفيذ الساعة ${EXECUTION_TIME}`);
          
          // الانتظار حتى الساعة 7:00 صباحاً
          await waitUntilTime(EXECUTION_TIME);
          
          // تنفيذ الحجز
          await performBooking();
        }
        
        main();
        EOF
    
    - name: Run booking automation
      env:
        SCHEDULED_TIME: ${{ github.event.inputs.scheduled_time }}
      run: |
        node booking.js
    
    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4  # ✅ تم التحديث إلى v4
      with:
        name: booking-result
        path: booking-result.json
    
    - name: Commit and push result
      if: success()
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add booking-result.json booking-url.json
        git commit -m "Update booking result [skip ci]" || echo "No changes to commit"
        git push
