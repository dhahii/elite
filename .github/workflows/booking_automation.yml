name: Elite Hospital Booking - Ultra Fast

on:
  repository_dispatch:
    types: [new_booking]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      booking_url:
        description: 'رابط الموعد (للتجربة اليدوية)'
        required: false
        type: string

jobs:
  ultra_fast_booking:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ⭐️ الخطوة 1: استقبال الرابط (سريع)
    - name: Save booking URL
      if: github.event_name == 'repository_dispatch'
      run: |
        echo '${{ toJSON(github.event.client_payload) }}' > booking-url.json
        URL=$(cat booking-url.json | jq -r '.url')
        echo "url=$URL" >> $GITHUB_OUTPUT
    
    # ⭐️ الخطوة 2: قراءة الرابط
    - name: Read URL
      id: read_url
      run: |
        if [ -f "booking-url.json" ]; then
          URL=$(cat booking-url.json | jq -r '.url')
          echo "url=$URL" >> $GITHUB_OUTPUT
        else
          echo "url=" >> $GITHUB_OUTPUT
        fi
    
    # ⭐️ الخطوة 3: تثبيت Python فائق السرعة (مع التخزين المؤقت)
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    # ⭐️ الخطوة 4: تثبيت Playwright مع التخزين المؤقت المسبق
    - name: Cache Playwright
      id: cache-playwright
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/pip
        key: playwright-ultra-${{ runner.os }}-v2
        restore-keys: |
          playwright-ultra-${{ runner.os }}-v2
    
    - name: Install dependencies (fast)
      run: |
        pip install playwright --no-cache-dir
    
    - name: Install browsers (cached)
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      run: |
        playwright install chromium --with-deps
    
    - name: Install deps (cached)
      if: steps.cache-playwright.outputs.cache-hit == 'true'
      run: |
        playwright install-deps
    
    # ⭐️ الخطوة 5: السكريبت فائق السرعة
    - name: Create ultra fast script
      run: |
        cat > book.py << 'EOF'
        import asyncio
        import json
        import random
        import os
        from datetime import datetime, timedelta
        from playwright.async_api import async_playwright
        
        # ⚡ إعدادات السرعة القصوى
        FAST = True
        ULTRA_FAST = True
        
        def get_egypt_time():
            return datetime.now() + timedelta(hours=2)
        
        async def wait_until_7am():
            """الانتظار حتى 7:00 صباحاً (أسرع نسخة)"""
            print("⏳ الانتظار حتى 7:00...")
            
            # ⚡ التحقق كل 5 ثواني فقط
            for _ in range(120):  # 10 دقائق كحد أقصى
                egypt_time = get_egypt_time()
                if egypt_time.hour >= 7:
                    print("✅ 7:00 - بدء التنفيذ!")
                    return
                await asyncio.sleep(5)  # 5 ثواني فقط
        
        async def book_appointment(url):
            print(f"⚡ بدء التشغيل فائق السرعة...")
            
            # ⏳ انتظار 7:00 (إذا لم يكن تشغيل يدوي)
            if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch':
                await wait_until_7am()
            
            # 🚀 تشغيل المتصفح (مع إعدادات السرعة القصوى)
            async with async_playwright() as p:
                browser = await p.chromium.launch(
                    headless=True,
                    args=[
                        '--no-sandbox',
                        '--disable-setuid-sandbox',
                        '--disable-dev-shm-usage',
                        '--disable-gpu',
                        '--disable-blink-features=AutomationControlled',
                        '--disable-background-timer-throttling',
                        '--disable-backgrounding-occluded-windows',
                        '--disable-renderer-backgrounding',
                        '--disable-ipc-flooding-protection',
                        '--disable-features=IsolateOrigins,site-per-process',
                        '--disable-web-security',
                        '--disable-features=BlockInsecurePrivateNetworkRequests',
                        '--disable-features=OutOfBlinkCors'
                    ]
                )
                
                # ⚡ سياق سريع جداً
                context = await browser.new_context(
                    viewport={'width': 1920, 'height': 1080},
                    user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    locale='ar-EG',
                    timezone_id='Africa/Cairo',
                    extra_http_headers={
                        'Accept-Encoding': 'gzip, deflate, br',
                        'Connection': 'keep-alive'
                    }
                )
                
                page = await context.new_page()
                
                # إخفاء البوت (سريع)
                await page.add_init_script("""
                    Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
                    Object.defineProperty(navigator, 'languages', { get: () => ['ar-EG', 'ar'] });
                """)
                
                # 📥 تحميل الصفحة فائق السرعة
                print("🌐 تحميل الصفحة...")
                try:
                    # ⚡ أسرع طريقة: انتظار العنصر المطلوب فقط
                    await page.goto(url, wait_until='commit', timeout=10000)
                    await page.wait_for_selector('h5', timeout=3000)
                except:
                    # طريقة احتياطية سريعة
                    await page.goto(url, wait_until='domcontentloaded', timeout=10000)
                
                # ⚡ تأخير بسيط جداً
                await asyncio.sleep(0.3)
                
                # 📋 استخراج البيانات فائق السرعة
                print("📋 استخراج البيانات...")
                data = await page.evaluate("""
                    () => {
                        const g = (s) => document.querySelector(s)?.textContent?.trim() || '';
                        return {
                            doctorName: g('h5'),
                            clinicName: g('h6'),
                            patientNumber: g('h1'),
                            currentNumber: g('h2'),
                            appointmentDate: g('small')
                        };
                    }
                """)
                
                print(f"👨‍⚕️ {data['doctorName']}")
                print(f"🔢 رقم: {data['patientNumber']}")
                
                # 🔍 البحث عن الزر والضغط عليه (أسرع طريقة)
                print("🔍 الضغط على الزر...")
                
                # ⚡ محاولة واحدة سريعة جداً
                try:
                    # الطريقة الأسرع: استخدام JavaScript مباشرة
                    result = await page.evaluate("""
                        () => {
                            const buttons = document.querySelectorAll('a');
                            for (const btn of buttons) {
                                if (btn.textContent.includes('قم بالحجز الأن')) {
                                    btn.click();
                                    return true;
                                }
                            }
                            return false;
                        }
                    """)
                    
                    if result:
                        print("🖱️ تم الضغط!")
                    else:
                        # طريقة احتياطية
                        await page.click('a[href*="Booking/Find"]')
                        print("🖱️ تم الضغط!")
                except:
                    # آخر محاولة
                    await page.click('.cta a.nav-link')
                    print("🖱️ تم الضغط!")
                
                # ⚡ انتظار بسيط جداً
                await asyncio.sleep(0.5)
                
                # انتظار التنقل (سريع)
                try:
                    await page.wait_for_navigation(wait_until='commit', timeout=5000)
                except:
                    pass
                
                # 📋 استخراج بيانات الحجز
                print("📋 استخراج بيانات الحجز...")
                booking_data = await page.evaluate("""
                    () => {
                        const g = (s) => document.querySelector(s)?.textContent?.trim() || '';
                        return {
                            patientNumber: g('h1'),
                            currentNumber: g('h2'),
                            appointmentDate: g('small')
                        };
                    }
                """)
                
                # دمج البيانات
                final_data = {
                    'doctorName': data['doctorName'],
                    'clinicName': data['clinicName'],
                    'patientNumber': booking_data['patientNumber'] or data['patientNumber'],
                    'currentNumber': booking_data['currentNumber'] or data['currentNumber'],
                    'appointmentDate': booking_data['appointmentDate'] or data['appointmentDate'],
                    'status': '✅ تم الحجز',
                    'timestamp': datetime.now().isoformat(),
                    'egyptTime': get_egypt_time().strftime('%Y-%m-%d %H:%M:%S'),
                    'bookingURL': url
                }
                
                # 💾 حفظ النتيجة
                with open('booking-result.json', 'w', encoding='utf-8') as f:
                    json.dump(final_data, f, ensure_ascii=False)
                
                print("✅ تم حفظ النتيجة")
                
                await browser.close()
                print("✅ تم الإنتهاء!")
                return True
        
        async def main():
            url = os.environ.get('BOOKING_URL', 'https://www.elitehospital.org/Queue/958053')
            success = await book_appointment(url)
            if not success:
                exit(1)
        
        if __name__ == "__main__":
            asyncio.run(main())
        EOF
    
    # ⭐️ الخطوة 6: تشغيل فائق السرعة
    - name: Run ultra fast
      run: |
        URL="${{ github.event.inputs.booking_url || steps.read_url.outputs.url || 'https://www.elitehospital.org/Queue/958053' }}"
        export BOOKING_URL="$URL"
        export PYTHONUNBUFFERED=1
        python3 book.py
    
    # ⭐️ الخطوة 7: رفع النتيجة
    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: booking-result
        path: |
          booking-result.json
          booking-url.json
        retention-days: 7
    
    # ⭐️ الخطوة 8: حفظ النتيجة
    - name: Commit
      if: success()
      run: |
        git config user.name "Bot"
        git config user.email "bot@github.com"
        git add booking-result.json booking-url.json 2>/dev/null || true
        git commit -m "Update [skip ci]" || echo "No changes"
        git push