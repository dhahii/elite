name: Elite Hospital Booking Automation

on:
  # ⭐️ استقبال رابط من التطبيق
  repository_dispatch:
    types: [new_booking]
  
  # ⭐️ جدولة يومية الساعة 7 صباحاً
  schedule:
    - cron: '0 5 * * *'
  
  # ⭐️ تشغيل يدوي
  workflow_dispatch:

jobs:
  process_booking:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ⭐️ استقبال الرابط من التطبيق
    - name: Save booking URL from app
      if: github.event_name == 'repository_dispatch'
      run: |
        echo '${{ toJSON(github.event.client_payload) }}' > booking-url.json
        echo "✅ تم حفظ رابط الموعد من التطبيق"
        cat booking-url.json
    
    # ⭐️ قراءة الرابط (من التطبيق أو من الملف)
    - name: Read booking URL
      id: read_url
      run: |
        if [ -f "booking-url.json" ]; then
          URL=$(cat booking-url.json | jq -r '.url')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ تم قراءة الرابط: $URL"
        else
          echo "⚠️ ملف booking-url.json غير موجود"
          echo "url=" >> $GITHUB_OUTPUT
        fi
    
    # ⭐️ تنفيذ الحجز (محاكاة)
    - name: Execute booking
      run: |
        URL="${{ steps.read_url.outputs.url }}"
        
        if [ -z "$URL" ]; then
          echo "❌ لا يوجد رابط للحجز"
          echo '{"success":false,"message":"لا يوجد رابط للحجز","timestamp":"'$(date -Iseconds)'","bookingDetails":null}' > booking-result.json
          exit 1
        fi
        
        echo "🔗 رابط الموعد: $URL"
        echo "⏰ بدء الحجز الساعة: $(date)"
        
        # محاكاة الحجز
        cat > booking-result.json << EOF
        {
          "success": true,
          "message": "تم الحجز بنجاح",
          "timestamp": "$(date -Iseconds)",
          "bookingDetails": {
            "doctorName": "د/حسين عبدالعزيز حسين عبدالقوي",
            "clinicName": "عيادة المسالك البولية",
            "patientNumber": "6",
            "currentNumber": "0",
            "status": "✅ تم الحجز بنجاح",
            "appointmentDate": "$(date)",
            "bookingURL": "$URL"
          }
        }
        EOF
        echo "✅ تم حفظ النتيجة"
    
    # ⭐️ حفظ النتيجة في المستودع
    - name: Commit and push result
      if: success()
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add booking-result.json booking-url.json 2>/dev/null || true
        git commit -m "Update booking result [skip ci]" || echo "No changes to commit"
        git push
