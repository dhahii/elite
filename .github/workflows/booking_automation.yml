name: Elite Hospital Booking Automation - Playwright

on:
  repository_dispatch:
    types: [new_booking]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      booking_url:
        description: 'رابط الموعد (للتجربة اليدوية)'
        required: false
        type: string

jobs:
  playwright_booking:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ⭐️ الخطوة 1: استقبال الرابط من التطبيق
    - name: Save booking URL from app
      if: github.event_name == 'repository_dispatch'
      run: |
        echo "📥 استقبال رابط من التطبيق"
        echo '${{ toJSON(github.event.client_payload) }}' > booking-url.json
        echo "✅ تم حفظ رابط الموعد"
        cat booking-url.json
    
    # ⭐️ الخطوة 2: قراءة الرابط
    - name: Read booking URL
      id: read_url
      run: |
        if [ -f "booking-url.json" ]; then
          URL=$(cat booking-url.json | jq -r '.url')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ الرابط من JSON: $URL"
        else
          echo "url=" >> $GITHUB_OUTPUT
        fi
    
    # ⭐️ الخطوة 3: تثبيت Playwright
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Playwright
      run: |
        npm init -y
        npm install playwright
        npx playwright install chromium
        npx playwright install-deps
    
    # ⭐️ الخطوة 4: إنشاء سكريبت Playwright
    - name: Create Playwright booking script
      run: |
        cat > book.js << 'EOF'
        const { chromium } = require('playwright');
        const fs = require('fs');
        
        async function bookAppointment(url) {
            console.log('🚀 بدء التشغيل مع Playwright...');
            console.log(`🌐 الرابط: ${url}`);
            
            // ⏳ انتظار حتى 7:00 صباحاً بتوقيت مصر
            console.log('⏳ الانتظار حتى 7:00 صباحاً بتوقيت مصر...');
            await waitUntil7AM();
            
            // 🚀 تشغيل المتصفح
            const browser = await chromium.launch({
                headless: true,
                args: [
                    '--no-sandbox',
                    '--disable-setuid-sandbox',
                    '--disable-dev-shm-usage',
                    '--disable-accelerated-2d-canvas',
                    '--disable-gpu',
                    '--window-size=1920,1080'
                ]
            });
            
            const context = await browser.newContext({
                viewport: { width: 1920, height: 1080 },
                userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                locale: 'ar-EG',
                timezoneId: 'Africa/Cairo',
                permissions: ['geolocation'],
                deviceScaleFactor: 1,
                hasTouch: false,
                isMobile: false
            });
            
            const page = await context.newPage();
            
            // إخفاء علامات البوت
            await page.addInitScript(() => {
                Object.defineProperty(navigator, 'webdriver', {
                    get: () => undefined
                });
                
                // محاكاة اللغة
                Object.defineProperty(navigator, 'languages', {
                    get: () => ['ar-EG', 'ar', 'en']
                });
                
                // محاكاة التشغيل
                Object.defineProperty(navigator, 'plugins', {
                    get: () => [1, 2, 3, 4, 5]
                });
            });
            
            // 📥 تحميل الصفحة
            console.log('🌐 تحميل صفحة الموعد...');
            await page.goto(url, {
                waitUntil: 'networkidle',
                timeout: 60000
            });
            
            // ⏳ تأخير عشوائي (محاكاة الإنسان)
            await randomDelay(1000, 3000);
            
            // 📋 استخراج البيانات الأولية
            console.log('📋 استخراج البيانات...');
            const initialData = await page.evaluate(() => {
                const getText = (selector) => {
                    const el = document.querySelector(selector);
                    return el ? el.textContent.trim() : '';
                };
                
                return {
                    doctorName: getText('h5'),
                    clinicName: getText('h6'),
                    patientNumber: getText('h1'),
                    currentNumber: getText('h2'),
                    appointmentDate: getText('small'),
                    status: '⏳ جاري الحجز...'
                };
            });
            
            console.log('👨‍⚕️ الطبيب:', initialData.doctorName);
            console.log('🏥 العيادة:', initialData.clinicName);
            console.log('🔢 رقم المريض:', initialData.patientNumber);
            console.log('📊 الرقم الحالي:', initialData.currentNumber);
            
            // 🔍 البحث عن زر "قم بالحجز الأن"
            console.log('🔍 البحث عن زر "قم بالحجز الأن"...');
            
            // محاولة طرق متعددة للعثور على الزر
            let buttonClicked = false;
            
            // الطريقة 1: البحث عن النص
            try {
                const button = await page.locator('a:has-text("قم بالحجز الأن")').first();
                if (await button.count() > 0) {
                    console.log('✅ تم العثور على الزر بالنص');
                    
                    // محاكاة حركة الفأرة
                    const box = await button.boundingBox();
                    if (box) {
                        const x = box.x + box.width / 2;
                        const y = box.y + box.height / 2;
                        
                        // حركة عشوائية
                        await page.mouse.move(x + randomOffset(), y + randomOffset());
                        await randomDelay(200, 600);
                        await page.mouse.move(x, y);
                        await randomDelay(300, 800);
                        
                        // الضغط
                        await page.mouse.click(x, y);
                        buttonClicked = true;
                        console.log('🖱️ تم الضغط على الزر!');
                    }
                }
            } catch (e) {
                console.log('⚠️ فشل البحث بالنص');
            }
            
            // الطريقة 2: البحث عن الرابط
            if (!buttonClicked) {
                try {
                    const button = await page.locator('a[href*="Booking/Find"]').first();
                    if (await button.count() > 0) {
                        console.log('✅ تم العثور على الزر بالرابط');
                        await button.click();
                        buttonClicked = true;
                        console.log('🖱️ تم الضغط على الزر!');
                    }
                } catch (e) {
                    console.log('⚠️ فشل البحث بالرابط');
                }
            }
            
            // الطريقة 3: البحث عن عنصر cta
            if (!buttonClicked) {
                try {
                    const button = await page.locator('.cta a.nav-link').first();
                    if (await button.count() > 0) {
                        console.log('✅ تم العثور على الزر في cta');
                        await button.click();
                        buttonClicked = true;
                        console.log('🖱️ تم الضغط على الزر!');
                    }
                } catch (e) {
                    console.log('⚠️ فشل البحث في cta');
                }
            }
            
            // الطريقة 4: البحث العام
            if (!buttonClicked) {
                try {
                    await page.evaluate(() => {
                        const buttons = document.querySelectorAll('a');
                        for (const btn of buttons) {
                            if (btn.textContent.includes('قم بالحجز الأن')) {
                                btn.click();
                                return;
                            }
                        }
                    });
                    buttonClicked = true;
                    console.log('🖱️ تم الضغط عبر JavaScript!');
                } catch (e) {
                    console.log('⚠️ فشل الضغط عبر JavaScript');
                }
            }
            
            if (!buttonClicked) {
                console.log('❌ لم يتم العثور على زر الحجز!');
                await browser.close();
                process.exit(1);
            }
            
            // ⏳ انتظار تحميل الصفحة الجديدة
            console.log('⏳ انتظار تحميل صفحة الحجز...');
            await randomDelay(1000, 2000);
            
            try {
                await page.waitForNavigation({
                    waitUntil: 'networkidle',
                    timeout: 30000
                });
            } catch (e) {
                console.log('⚠️ لم يتم التنقل، قد تكون الصفحة نفسها');
            }
            
            // 📋 استخراج البيانات من صفحة الحجز
            console.log('📋 استخراج بيانات الحجز...');
            const bookingData = await page.evaluate(() => {
                const getText = (selector) => {
                    const el = document.querySelector(selector);
                    return el ? el.textContent.trim() : '';
                };
                
                return {
                    patientNumber: getText('h1'),
                    currentNumber: getText('h2'),
                    appointmentDate: getText('small')
                };
            });
            
            // دمج البيانات
            const finalData = {
                ...initialData,
                patientNumber: bookingData.patientNumber || initialData.patientNumber,
                currentNumber: bookingData.currentNumber || initialData.currentNumber,
                appointmentDate: bookingData.appointmentDate || initialData.appointmentDate,
                status: '✅ تم الحجز بنجاح',
                timestamp: new Date().toISOString(),
                egyptTime: new Date().toLocaleString('ar-EG', {
                    timeZone: 'Africa/Cairo'
                }),
                bookingURL: url
            };
            
            // حفظ النتيجة
            fs.writeFileSync('booking-result.json', JSON.stringify(finalData, null, 2));
            console.log('✅ تم حفظ النتيجة');
            console.log('📋 البيانات النهائية:', finalData);
            
            // حفظ صفحة HTML
            const html = await page.content();
            fs.writeFileSync('booking-page.html', html);
            console.log('✅ تم حفظ صفحة الحجز');
            
            await browser.close();
            console.log('✅ تم إنهاء العملية بنجاح!');
        }
        
        // وظائف مساعدة
        function randomDelay(min, max) {
            return new Promise(resolve => {
                const delay = Math.random() * (max - min) + min;
                setTimeout(resolve, delay);
            });
        }
        
        function randomOffset() {
            return (Math.random() - 0.5) * 20;
        }
        
        function waitUntil7AM() {
            return new Promise((resolve) => {
                const checkTime = () => {
                    const now = new Date();
                    // توقيت مصر (UTC+2)
                    const egyptTime = new Date(now.getTime() + (2 * 60 * 60 * 1000));
                    const hours = egyptTime.getHours();
                    const minutes = egyptTime.getMinutes();
                    
                    console.log(`🕐 الوقت الحالي (مصر): ${hours}:${minutes}`);
                    
                    if (hours >= 7 && minutes >= 0) {
                        console.log('✅ الساعة 7:00 صباحاً - بدء التنفيذ!');
                        resolve();
                    } else {
                        console.log(`⏳ الانتظار...`);
                        setTimeout(checkTime, 30000);
                    }
                };
                checkTime();
            });
        }
        
        // تشغيل السكريبت
        const url = process.argv[2] || 'https://www.elitehospital.org/Queue/958053';
        bookAppointment(url).catch(error => {
            console.error('❌ خطأ:', error);
            process.exit(1);
        });
        EOF
    
    # ⭐️ الخطوة 5: تشغيل السكريبت
    - name: Run Playwright booking script
      run: |
        URL="${{ github.event.inputs.booking_url || steps.read_url.outputs.url || 'https://www.elitehospital.org/Queue/958053' }}"
        node book.js "$URL"
    
    # ⭐️ الخطوة 6: رفع النتيجة
    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: booking-result
        path: |
          booking-result.json
          booking-page.html
          booking-url.json
        retention-days: 7
    
    # ⭐️ الخطوة 7: حفظ النتيجة في المستودع
    - name: Commit and push result
      if: success()
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add booking-result.json booking-url.json 2>/dev/null || true
        git commit -m "Update booking result [skip ci] - $(TZ='Africa/Cairo' date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        git push