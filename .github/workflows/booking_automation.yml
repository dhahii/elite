name: Elite Hospital Booking - Super Fast

on:
  repository_dispatch:
    types: [new_booking]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      booking_url:
        description: 'رابط الموعد (للتجربة اليدوية)'
        required: false
        type: string

jobs:
  super_fast_booking:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ⭐️ استقبال الرابط
    - name: Save booking URL
      if: github.event_name == 'repository_dispatch'
      run: |
        echo '${{ toJSON(github.event.client_payload) }}' > booking-url.json
    
    # ⭐️ قراءة الرابط
    - name: Read URL
      id: read_url
      run: |
        if [ -f "booking-url.json" ]; then
          URL=$(cat booking-url.json | jq -r '.url')
          echo "url=$URL" >> $GITHUB_OUTPUT
        else
          echo "url=" >> $GITHUB_OUTPUT
        fi
    
    # ⭐️ تثبيت Python
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    # ⭐️ تثبيت Playwright فقط (بدون متصفح)
    - name: Install dependencies
      run: |
        pip install playwright
    
    # ⭐️ استخدام Chrome المثبت (بدون تحميل)
    - name: Install Playwright dependencies
      run: |
        playwright install-deps
    
    # ⭐️ إنشاء السكريبت (يستخدم Chrome المثبت)
    - name: Create script
      run: |
        cat > book.py << 'EOF'
        import asyncio
        import json
        import os
        import random
        from datetime import datetime
        from playwright.async_api import async_playwright
        
        print(f"🚀 بدء التشغيل السريع - {datetime.now()}")
        
        USER_AGENTS = [
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.6478.127 Safari/537.36',
        ]
        
        VIEWPORTS = [
            {'width': 1920, 'height': 1080},
            {'width': 1366, 'height': 768},
        ]
        
        def get_random_user_agent():
            return random.choice(USER_AGENTS)
        
        def get_random_viewport():
            return random.choice(VIEWPORTS)
        
        async def extract_data(page):
            return await page.evaluate("""
                () => {
                    const g = (s) => document.querySelector(s)?.textContent?.trim() || '';
                    return {
                        doctorName: g('h5'),
                        clinicName: g('h6'),
                        patientNumber: g('h1'),
                        currentNumber: g('h2'),
                        appointmentDate: g('small')
                    };
                }
            """)
        
        async def book_appointment(url):
            print(f"🌐 الرابط: {url}")
            
            async with async_playwright() as p:
                # ⭐️ استخدام Chrome المثبت (0 ثانية تحميل)
                browser = await p.chromium.launch(
                    channel='chrome',  # ⭐️ استخدام Chrome المثبت
                    headless=True,
                    args=[
                        '--no-sandbox',
                        '--disable-dev-shm-usage',
                        '--disable-gpu',
                        '--disable-blink-features=AutomationControlled',
                    ]
                )
                
                viewport = get_random_viewport()
                context = await browser.new_context(
                    viewport=viewport,
                    user_agent=get_random_user_agent(),
                    locale='ar-EG',
                    timezone_id='Africa/Cairo',
                    ignore_https_errors=True,
                )
                
                page = await context.new_page()
                
                await page.add_init_script("""
                    Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
                    window.chrome = { runtime: {} };
                """)
                
                try:
                    print("🌐 تحميل الصفحة...")
                    await page.goto(url, wait_until='commit', timeout=15000)
                    await page.wait_for_selector('h5', timeout=3000)
                    
                    print("📋 استخراج البيانات...")
                    data = await extract_data(page)
                    
                    print(f"👨‍⚕️ {data['doctorName']}")
                    print(f"🔢 رقم: {data['patientNumber']}")
                    
                    # الضغط على الزر (أسرع طريقة)
                    clicked = await page.evaluate("""
                        () => {
                            for (const btn of document.querySelectorAll('a')) {
                                if (btn.textContent.includes('قم بالحجز الأن')) {
                                    btn.click();
                                    return true;
                                }
                            }
                            return false;
                        }
                    """)
                    
                    if not clicked:
                        try:
                            btn = await page.locator('a[href*="Booking/Find"]').first
                            if await btn.count() > 0:
                                await btn.click()
                                clicked = True
                        except:
                            pass
                    
                    if not clicked:
                        print("❌ لم يتم العثور على الزر")
                        await browser.close()
                        return None
                    
                    print("🖱️ تم الضغط!")
                    
                    await asyncio.sleep(0.5)
                    
                    try:
                        await page.wait_for_navigation(wait_until='commit', timeout=5000)
                    except:
                        pass
                    
                    print("📋 استخراج بيانات الحجز...")
                    booking_data = await extract_data(page)
                    
                    final_data = {
                        'doctorName': data['doctorName'],
                        'clinicName': data['clinicName'],
                        'patientNumber': booking_data['patientNumber'] or data['patientNumber'],
                        'currentNumber': booking_data['currentNumber'] or data['currentNumber'],
                        'appointmentDate': booking_data['appointmentDate'] or data['appointmentDate'],
                        'status': '✅ تم الحجز',
                        'timestamp': datetime.now().isoformat(),
                        'bookingURL': url
                    }
                    
                    with open('booking-result.json', 'w', encoding='utf-8') as f:
                        json.dump(final_data, f, ensure_ascii=False, indent=2)
                    
                    print("✅ تم حفظ النتيجة")
                    
                    await browser.close()
                    print("✅ تم الانتهاء!")
                    return final_data
                    
                except Exception as e:
                    print(f"❌ خطأ: {e}")
                    await browser.close()
                    return None
        
        async def main():
            url = os.environ.get('BOOKING_URL', 'https://www.elitehospital.org/Queue/958053')
            result = await book_appointment(url)
            if not result:
                exit(1)
        
        if __name__ == "__main__":
            asyncio.run(main())
        EOF
    
    # ⭐️ تشغيل السكريبت
    - name: Run script
      run: |
        URL="${{ github.event.inputs.booking_url || steps.read_url.outputs.url || 'https://www.elitehospital.org/Queue/958053' }}"
        export BOOKING_URL="$URL"
        python3 book.py
    
    # ⭐️ رفع النتيجة
    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: booking-result
        path: |
          booking-result.json
          booking-url.json
        retention-days: 7
    
    # ⭐️ حفظ النتيجة
    - name: Commit result
      if: success()
      run: |
        git config user.name "Bot"
        git config user.email "bot@github.com"
        git add booking-result.json booking-url.json 2>/dev/null || true
        git commit -m "Update [skip ci]" || echo "No changes"
        git push