name: Elite Hospital Booking Automation

on:
  repository_dispatch:
    types: [new_booking]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      booking_url:
        description: 'رابط الموعد (للتجربة)'
        required: false
        type: string

jobs:
  process_booking:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ⭐️ الخطوة 1: استقبال الرابط من التطبيق
    - name: Save booking URL from app
      if: github.event_name == 'repository_dispatch'
      run: |
        echo "📥 استقبال رابط من التطبيق"
        echo '${{ toJSON(github.event.client_payload) }}' > booking-url.json
        echo "✅ تم حفظ رابط الموعد"
        cat booking-url.json
    
    # ⭐️ الخطوة 2: قراءة الرابط من JSON
    - name: Read booking URL
      id: read_url
      run: |
        if [ -f "booking-url.json" ]; then
          URL=$(cat booking-url.json | jq -r '.url')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ الرابط من JSON: $URL"
        else
          echo "url=" >> $GITHUB_OUTPUT
        fi
    
    # ⭐️ الخطوة 3: تحميل صفحة الموعد (فوراً)
    - name: Load booking page
      run: |
        URL="${{ github.event.inputs.booking_url || steps.read_url.outputs.url }}"
        
        if [ -z "$URL" ]; then
          echo "❌ لا يوجد رابط"
          echo '{"success":false,"message":"لا يوجد رابط","timestamp":"'$(date -Iseconds)'","bookingDetails":null}' > booking-result.json
          exit 1
        fi
        
        echo "🌐 تحميل صفحة الموعد: $URL"
        curl -s -L \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9" \
          -H "Accept-Language: ar-EG,ar;q=0.9,en;q=0.8" \
          "$URL" > page.html
        
        echo "📄 حجم الصفحة: $(wc -c < page.html) بايت"
    
    # ⭐️ الخطوة 4: استخراج اسم الدكتور والعيادة (فوراً)
    - name: Extract doctor and clinic name
      id: extract_doctor
      run: |
        echo "📋 استخراج اسم الدكتور والعيادة..."
        
        # ⭐️ اسم الطبيب - من <h5>
        DOCTOR=$(grep -o '<h5[^>]*>[^<]*</h5>' page.html | head -1 | sed 's/<[^>]*>//g' | xargs)
        DOCTOR=$(echo "$DOCTOR" | sed 's/&#x[0-9a-fA-F]*;//g' | sed 's/&#[0-9]*;//g')
        [ -z "$DOCTOR" ] && DOCTOR=$(grep -o 'د/[^<"]*' page.html | head -1 | xargs)
        [ -z "$DOCTOR" ] && DOCTOR="غير معروف"
        
        # ⭐️ اسم العيادة - من <h6>
        CLINIC=$(grep -o '<h6[^>]*>[^<]*</h6>' page.html | head -1 | sed 's/<[^>]*>//g' | xargs)
        CLINIC=$(echo "$CLINIC" | sed 's/&#x[0-9a-fA-F]*;//g' | sed 's/&#[0-9]*;//g')
        [ -z "$CLINIC" ] && CLINIC=$(grep -o 'عيادة[^<"]*' page.html | head -1 | xargs)
        [ -z "$CLINIC" ] && CLINIC="غير معروف"
        
        # ⭐️ حفظ البيانات في ملف مؤقت
        echo "doctor=$DOCTOR" >> $GITHUB_OUTPUT
        echo "clinic=$CLINIC" >> $GITHUB_OUTPUT
        
        # ⭐️ إنشاء ملف JSON مؤقت للبيانات
        cat > doctor-info.json << EOF
        {
          "doctorName": "$DOCTOR",
          "clinicName": "$CLINIC"
        }
        EOF
        
        echo "✅ اسم الدكتور: $DOCTOR"
        echo "✅ العيادة: $CLINIC"
        echo "⏳ الانتظار حتى الساعة 7:00 صباحاً..."
    
    # ⭐️ الخطوة 5: الانتظار حتى الساعة 7:00 صباحاً
    - name: Wait until 7:00 AM
      run: |
        echo "⏳ بدء الانتظار حتى الساعة 7:00 صباحاً..."
        
        # حساب الوقت المتبقي حتى 7:00
        while true; do
          CURRENT_HOUR=$(date +%H)
          CURRENT_MIN=$(date +%M)
          
          if [ "$CURRENT_HOUR" -ge 7 ] && [ "$CURRENT_MIN" -ge 0 ]; then
            echo "✅ الساعة الآن 7:00 صباحاً - بدء التنفيذ!"
            break
          fi
          
          echo "⏳ الوقت الآن: $(date +%H:%M) - الانتظار..."
          sleep 60
        done
    
    # ⭐️ الخطوة 6: البحث عن زر "قم بالحجز الأن"
    - name: Find booking button
      id: find_button
      run: |
        BOOKING_LINK=$(grep -o 'href="[^"]*Booking/Find[^"]*"' page.html | head -1 | sed 's/href="//;s/"//g')
        
        if [ -n "$BOOKING_LINK" ]; then
          echo "✅ تم العثور على زر الحجز"
          echo "link=$BOOKING_LINK" >> $GITHUB_OUTPUT
          
          if [[ "$BOOKING_LINK" == https* ]]; then
            FULL_URL="$BOOKING_LINK"
          else
            FULL_URL="https://www.elitehospital.org$BOOKING_LINK"
          fi
          echo "full_url=$FULL_URL" >> $GITHUB_OUTPUT
        else
          echo "⚠️ لم يتم العثور على زر الحجز"
          echo "link=" >> $GITHUB_OUTPUT
        fi
    
    # ⭐️ الخطوة 7: الضغط على زر الحجز (الساعة 7:00)
    - name: Click booking button
      if: steps.find_button.outputs.link != ''
      run: |
        FULL_URL="${{ steps.find_button.outputs.full_url }}"
        echo "🖱️ الضغط على زر الحجز: $FULL_URL"
        echo "⏰ الوقت: $(date)"
        
        curl -s -L \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9" \
          -H "Accept-Language: ar-EG,ar;q=0.9,en;q=0.8" \
          -H "Referer: ${{ steps.read_url.outputs.url }}" \
          "$FULL_URL" > booking-page.html
        
        echo "📄 حجم صفحة الحجز: $(wc -c < booking-page.html) بايت"
    
    # ⭐️ الخطوة 8: استخراج رقم الدور من صفحة الحجز
    - name: Extract queue number
      run: |
        echo "📋 استخراج رقم الدور من صفحة الحجز..."
        
        # ⭐️ استخراج رقم المريض من صفحة الحجز
        PATIENT=$(grep -o '<h1[^>]*>[^<]*</h1>' booking-page.html | head -1 | sed 's/<[^>]*>//g' | xargs)
        [ -z "$PATIENT" ] && PATIENT=$(grep -o 'رقمك[^0-9]*[0-9]\+' booking-page.html | grep -o '[0-9]\+' | head -1)
        [ -z "$PATIENT" ] && PATIENT=$(grep -o 'موعدكم[^0-9]*[0-9]\+' booking-page.html | grep -o '[0-9]\+' | head -1)
        [ -z "$PATIENT" ] && PATIENT=$(grep -o '[0-9]\{4,8\}' booking-page.html | head -1)
        [ -z "$PATIENT" ] && PATIENT="غير معروف"
        
        # ⭐️ استخراج الرقم الحالي
        CURRENT=$(grep -o 'الرقم الحالي[^0-9]*[0-9]\+' booking-page.html | grep -o '[0-9]\+' | head -1)
        [ -z "$CURRENT" ] && CURRENT=$(grep -o '<h2[^>]*>[^<]*</h2>' booking-page.html | grep -o '[0-9]\+' | head -1)
        [ -z "$CURRENT" ] && CURRENT="0"
        
        # ⭐️ استخراج التاريخ
        DATE=$(grep -o '<small[^>]*>[^<]*</small>' booking-page.html | head -1 | sed 's/<[^>]*>//g' | xargs)
        [ -z "$DATE" ] && DATE=$(grep -o '[0-9]\{2\}/[0-9]\{2\}/[0-9]\{4\} [0-9]\{2\}:[0-9]\{2\}' booking-page.html | head -1)
        [ -z "$DATE" ] && DATE=$(date '+%d/%m/%Y %H:%M:%S')
        
        # ⭐️ قراءة اسم الدكتور والعيادة من الملف المؤقت
        DOCTOR=$(cat doctor-info.json | jq -r '.doctorName')
        CLINIC=$(cat doctor-info.json | jq -r '.clinicName')
        
        # ⭐️ رابط الحجز الأصلي من ملف JSON
        ORIGINAL_URL=$(cat booking-url.json | jq -r '.url')
        
        # ⭐️ تحديث ملف النتيجة نفسه (وليس إنشاء ملف جديد)
        cat > booking-result.json << EOF
        {
          "success": true,
          "message": "تم الحجز بنجاح",
          "timestamp": "$(date -Iseconds)",
          "bookingDetails": {
            "doctorName": "$DOCTOR",
            "clinicName": "$CLINIC",
            "patientNumber": "$PATIENT",
            "currentNumber": "$CURRENT",
            "status": "✅ تم الحجز بنجاح",
            "appointmentDate": "$DATE",
            "bookingURL": "$ORIGINAL_URL"
          }
        }
        EOF
        
        echo "✅ تم تحديث ملف النتيجة بنجاح"
        echo "👨‍⚕️ الطبيب: $DOCTOR"
        echo "🏥 العيادة: $CLINIC"
        echo "🔢 رقمك: $PATIENT"
        echo "📊 الرقم الحالي: $CURRENT"
        echo "📅 التاريخ: $DATE"
    
    # ⭐️ رفع النتيجة
    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: booking-result
        path: |
          booking-result.json
          booking-url.json
          doctor-info.json
          page.html
          booking-page.html
        retention-days: 7
    
    # ⭐️ حفظ النتيجة في المستودع
    - name: Commit and push result
      if: success()
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add booking-result.json booking-url.json doctor-info.json 2>/dev/null || true
        git commit -m "Update booking result [skip ci]" || echo "No changes to commit"
        git push