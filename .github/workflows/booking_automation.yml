name: Elite Hospital Booking Automation

on:
  repository_dispatch:
    types: [new_booking]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      booking_url:
        description: 'رابط الموعد (للتجربة)'
        required: false
        type: string

jobs:
  process_booking:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ⭐️ الخطوة 1: استقبال الرابط من التطبيق
    - name: Save booking URL from app
      if: github.event_name == 'repository_dispatch'
      run: |
        echo "📥 استقبال رابط من التطبيق"
        echo '${{ toJSON(github.event.client_payload) }}' > booking-url.json
        echo "✅ تم حفظ رابط الموعد"
        cat booking-url.json
    
    # ⭐️ الخطوة 2: قراءة الرابط من JSON
    - name: Read booking URL
      id: read_url
      run: |
        if [ -f "booking-url.json" ]; then
          URL=$(cat booking-url.json | jq -r '.url')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ الرابط من JSON: $URL"
        else
          echo "url=" >> $GITHUB_OUTPUT
        fi
    
    # ⭐️ الخطوة 3: تحميل صفحة الموعد (فوراً)
    - name: Load booking page
      run: |
        URL="${{ github.event.inputs.booking_url || steps.read_url.outputs.url }}"
        
        if [ -z "$URL" ]; then
          echo "❌ لا يوجد رابط"
          echo '{"success":false,"message":"لا يوجد رابط","timestamp":"'$(date -Iseconds)'","bookingDetails":null}' > booking-result.json
          exit 1
        fi
        
        echo "🌐 تحميل صفحة الموعد: $URL"
        curl -s -L \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9" \
          -H "Accept-Language: ar-EG,ar;q=0.9,en;q=0.8" \
          "$URL" > page.html
        
        echo "📄 حجم الصفحة: $(wc -c < page.html) بايت"
    
    # ⭐️ الخطوة 4: تثبيت Python و BeautifulSoup
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Python dependencies
      run: |
        pip install beautifulsoup4 lxml
    
    # ⭐️ الخطوة 5: استخراج اسم الدكتور والعيادة والتاريخ باستخدام Python
    - name: Extract doctor, clinic and date
      id: extract_data
      run: |
        echo "📋 استخراج البيانات باستخدام Python..."
        
        python3 << 'PYTHON_SCRIPT'
        import json
        import re
        from bs4 import BeautifulSoup
        
        # قراءة الصفحة
        with open('page.html', 'r', encoding='utf-8') as f:
            html_content = f.read()
        
        soup = BeautifulSoup(html_content, 'html.parser')
        
        # ⭐️ استخراج اسم الدكتور - من <h5> الأول
        doctor_tag = soup.find('h5')
        doctor_name = doctor_tag.get_text(strip=True) if doctor_tag else ""
        
        # إذا لم يتم العثور عليه، حاول البحث عن "د/"
        if not doctor_name or doctor_name == "/":
            match = re.search(r'د/[^<"\s]+(?:\s[^<"\s]+)*', html_content)
            doctor_name = match.group(0) if match else "غير معروف"
        
        # ⭐️ استخراج اسم العيادة - من <h6> الأول
        clinic_tag = soup.find('h6')
        clinic_name = clinic_tag.get_text(strip=True) if clinic_tag else ""
        
        # إذا لم يتم العثور عليه، حاول البحث عن "عيادة"
        if not clinic_name or clinic_name == "":
            match = re.search(r'عيادة[^<"\n]+', html_content)
            clinic_name = match.group(0) if match else "غير معروف"
        
        # ⭐️ استخراج التاريخ والوقت بشكل صحيح
        # البحث عن التاريخ: 09-05-2026
        date_match = re.search(r'(\d{2})-(\d{2})-(\d{4})', html_content)
        # البحث عن الوقت: 11:00
        time_match = re.search(r'(\d{2}):(\d{2})', html_content)
        
        if date_match and time_match:
            # تحويل التاريخ من DD-MM-YYYY إلى DD/MM/YYYY
            day = date_match.group(1)
            month = date_match.group(2)
            year = date_match.group(3)
            booking_date = f"{day}/{month}/{year}"
            booking_time = f"{time_match.group(1)}:{time_match.group(2)}"
            appointment_date = f"{booking_date} {booking_time}"
        else:
            appointment_date = ""
        
        # ⭐️ استخراج رقم الموعد من الرابط
        url = "${{ steps.read_url.outputs.url }}"
        patient_match = re.search(r'(\d{7,8})', url)
        patient_number = patient_match.group(1) if patient_match else "غير معروف"
        
        # ⭐️ حفظ البيانات في ملف مؤقت
        result = {
            "doctorName": doctor_name if doctor_name else "غير معروف",
            "clinicName": clinic_name if clinic_name else "غير معروف",
            "patientNumber": patient_number,
            "appointmentDate": appointment_date if appointment_date else "",
            "bookingURL": url
        }
        
        with open('extracted-data.json', 'w', encoding='utf-8') as f:
            json.dump(result, f, ensure_ascii=False, indent=2)
        
        print(f"✅ تم استخراج البيانات:")
        print(f"👨‍⚕️ الطبيب: {result['doctorName']}")
        print(f"🏥 العيادة: {result['clinicName']}")
        print(f"🔢 رقم الموعد: {result['patientNumber']}")
        print(f"📅 التاريخ: {result['appointmentDate']}")
        PYTHON_SCRIPT
        
        echo "⏳ الانتظار حتى الساعة 7:00 صباحاً..."
    
    # ⭐️ الخطوة 6: الانتظار حتى الساعة 7:00 صباحاً
    - name: Wait until 7:00 AM
      run: |
        echo "⏳ بدء الانتظار حتى الساعة 7:00 صباحاً..."
        
        while true; do
          CURRENT_HOUR=$(date +%H)
          CURRENT_MIN=$(date +%M)
          
          if [ "$CURRENT_HOUR" -ge 7 ] && [ "$CURRENT_MIN" -ge 0 ]; then
            echo "✅ الساعة الآن 7:00 صباحاً - بدء التنفيذ!"
            break
          fi
          
          echo "⏳ الوقت الآن: $(date +%H:%M) - الانتظار..."
          sleep 60
        done
    
    # ⭐️ الخطوة 7: البحث عن زر "قم بالحجز الأن"
    - name: Find booking button
      id: find_button
      run: |
        # البحث عن الرابط باستخدام عدة أنماط
        BOOKING_LINK=$(grep -oE 'href="([^"]*Booking/Find[^"]*)"' page.html | head -1 | sed 's/href="//;s/"//g')
        
        if [ -z "$BOOKING_LINK" ]; then
          BOOKING_LINK=$(grep -o "href='[^']*Booking/Find[^']*'" page.html | head -1 | sed "s/href='//;s/'//g")
        fi
        
        if [ -z "$BOOKING_LINK" ]; then
          BOOKING_LINK=$(grep -o 'href="[^"]*"' page.html | grep "Booking/Find" | head -1 | sed 's/href="//;s/"//g')
        fi
            
        if [ -n "$BOOKING_LINK" ]; then
          echo "✅ تم العثور على زر الحجز: $BOOKING_LINK"
          echo "link=$BOOKING_LINK" >> $GITHUB_OUTPUT
          
          if [[ "$BOOKING_LINK" == https* ]]; then
            FULL_URL="$BOOKING_LINK"
          else
            FULL_URL="https://www.elitehospital.org$BOOKING_LINK"
          fi
          echo "full_url=$FULL_URL" >> $GITHUB_OUTPUT
        else
          echo "⚠️ لم يتم العثور على زر الحجز"
          echo "link=" >> $GITHUB_OUTPUT
        fi
    
    # ⭐️ الخطوة 8: الضغط على زر الحجز (الساعة 7:00)
    - name: Click booking button
      if: steps.find_button.outputs.link != ''
      run: |
        FULL_URL="${{ steps.find_button.outputs.full_url }}"
        echo "🖱️ الضغط على زر الحجز: $FULL_URL"
        echo "⏰ الوقت: $(date)"
        
        curl -s -L \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9" \
          -H "Accept-Language: ar-EG,ar;q=0.9,en;q=0.8" \
          -H "Referer: ${{ steps.read_url.outputs.url }}" \
          "$FULL_URL" > booking-page.html
        
        echo "📄 حجم صفحة الحجز: $(wc -c < booking-page.html) بايت"
    
    # ⭐️ الخطوة 9: استخراج رقم الدور وتحديث نفس الملف (المرة الثانية)
    - name: Extract queue number and update same file
      run: |
        echo "📋 استخراج رقم الدور من صفحة الحجز..."
        
        # تنظيف الصفحة
        cat booking-page.html | sed 's/&#x[0-9a-fA-F]*;//g' | sed 's/&#[0-9]*;//g' > booking-clean.html
        
        # استخراج رقم المريض - من الرابط أو من الصفحة
        PATIENT=$(echo "${{ steps.read_url.outputs.url }}" | grep -o '[0-9]\{7,8\}' | head -1)
        if [ -z "$PATIENT" ]; then
          PATIENT=$(grep -o '[0-9]\{7,8\}' booking-clean.html | head -1)
        fi
        [ -z "$PATIENT" ] && PATIENT="غير معروف"
        
        # استخراج الرقم الحالي
        CURRENT=$(grep -o 'الرقم الحالي[^0-9]*[0-9]\+' booking-clean.html | grep -o '[0-9]\+' | head -1)
        if [ -z "$CURRENT" ]; then
          CURRENT=$(grep -o '<h2[^>]*>[^<]*</h2>' booking-clean.html | grep -o '[0-9]\+' | head -1)
        fi
        [ -z "$CURRENT" ] && CURRENT="0"
        
        # ⭐️ قراءة البيانات المستخرجة من Python (بما في ذلك التاريخ الصحيح)
        DOCTOR=$(cat extracted-data.json | jq -r '.doctorName')
        CLINIC=$(cat extracted-data.json | jq -r '.clinicName')
        APPOINTMENT_DATE=$(cat extracted-data.json | jq -r '.appointmentDate')
        ORIGINAL_URL=$(cat booking-url.json | jq -r '.url')
        
        # إذا لم يتم استخراج التاريخ، استخدم التاريخ من صفحة الحجز
        if [ -z "$APPOINTMENT_DATE" ] || [ "$APPOINTMENT_DATE" = "" ]; then
          BOOKING_DATE=$(grep -o '[0-9]\{2\}-[0-9]\{2\}-[0-9]\{4\}' booking-clean.html | head -1)
          BOOKING_TIME=$(grep -o '[0-9]\{2\}:[0-9]\{2\}' booking-clean.html | head -1)
          
          if [ -n "$BOOKING_DATE" ] && [ -n "$BOOKING_TIME" ]; then
            APPOINTMENT_DATE="$BOOKING_DATE $BOOKING_TIME"
            APPOINTMENT_DATE=$(echo "$APPOINTMENT_DATE" | sed 's/-/\//g')
          else
            APPOINTMENT_DATE=$(date '+%d/%m/%Y %H:%M:%S')
          fi
        fi
        
        # تحديث نفس ملف booking-result.json (المرة الثانية)
        cat > booking-result.json << EOF
        {
          "success": true,
          "message": "تم الحجز بنجاح",
          "timestamp": "$(date -Iseconds)",
          "bookingDetails": {
            "doctorName": "$DOCTOR",
            "clinicName": "$CLINIC",
            "patientNumber": "$PATIENT",
            "currentNumber": "$CURRENT",
            "status": "✅ تم الحجز بنجاح",
            "appointmentDate": "$APPOINTMENT_DATE",
            "bookingURL": "$ORIGINAL_URL"
          }
        }
        EOF
        
        echo "✅ تم تحديث نفس ملف booking-result.json بالبيانات النهائية"
        echo "👨‍⚕️ الطبيب: $DOCTOR"
        echo "🏥 العيادة: $CLINIC"
        echo "🔢 رقمك: $PATIENT"
        echo "📊 الرقم الحالي: $CURRENT"
        echo "📅 التاريخ: $APPOINTMENT_DATE"
    
    # ⭐️ الخطوة 10: رفع النتيجة
    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: booking-result
        path: |
          booking-result.json
          booking-url.json
          extracted-data.json
          page.html
          booking-page.html
        retention-days: 7
    
    # ⭐️ الخطوة 11: حفظ النتيجة في المستودع
    - name: Commit and push result
      if: success()
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add booking-result.json booking-url.json extracted-data.json 2>/dev/null || true
        git commit -m "Update booking result [skip ci]" || echo "No changes to commit"
        git push