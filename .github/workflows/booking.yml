name: 🏥 حجز مستشفى إيليت

on:
  schedule:
    - cron: '0 5 * * *'
  repository_dispatch:
    types: [book_appointment]
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: تجهيز بايثون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: تثبيت Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps
      
      - name: تشغيل الحجز
        run: python booking.py
        env:
          BOOKING_URL: ${{ github.event.client_payload.booking_url }}
      
      - name: حفظ النتيجة
        uses: actions/upload-artifact@v4  # ✅ تم التحديث إلى v4
        with:
          name: booking-result
          path: booking_result.json
      
      - name: تحديث الملف في المستودع
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add booking_result.json
          git commit -m "Auto-update booking result [skip ci]" || echo "No changes"
          git push
