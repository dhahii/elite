# .github/workflows/booking.yml
name: 🏥 حجز مستشفى إيليت

on:
  schedule:
    - cron: '0 5 * * *'          # 7 صباحاً مصر
  workflow_dispatch:              # للتشغيل اليدوي

jobs:
  book:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: تجهيز بايثون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: تثبيت Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps
      
      - name: تشغيل الحجز
        run: python booking.py
        env:
          BOOKING_URL: ${{ secrets.BOOKING_URL }}   # الرابط من التطبيق
      
      - name: حفظ النتيجة
        uses: actions/upload-artifact@v3
        with:
          name: booking-result
          path: booking_result.json
      
      - name: نشر النتيجة
        run: |
          mkdir -p docs/api
          cp booking_result.json docs/api/status.json
      
      - name: رفع الصفحة
        uses: actions/upload-pages-artifact@v2
        with:
          path: docs/
      
      - name: نشر
        uses: actions/deploy-pages@v2
